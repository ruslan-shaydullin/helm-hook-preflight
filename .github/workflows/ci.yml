name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and package
        run: python -m pip install . build
      - name: Offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python -m build
      - name: Install wheel and sdist outside source tree
        shell: bash
        run: |
          python scripts/verify_install.py dist/*.whl --tests > wheel-check.json
          python scripts/verify_install.py dist/*.tar.gz > sdist-check.json
      - name: Preserve build and installation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.python }}-package
          path: |
            dist/
            wheel-check.json
            sdist-check.json
