name: Incorrect finding or input failure
description: Report a reproducible contract failure without Secret values.
body:
  - type: textarea
    id: task
    attributes:
      label: Chart task, tool/Helm version, command, and actual result
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized YAML and expected result
      description: Remove Secret data/stringData, credentials, and private names. Include relevant hook annotations and references.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: First-install prerequisites and external dependencies
